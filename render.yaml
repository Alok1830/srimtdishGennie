services:
  - type: web
    name: dishgennie
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn dishgennie.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dishgennie_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: dishgennie_db
    databaseName: dishgennie
    user: dishgennie_user
    plan: free
